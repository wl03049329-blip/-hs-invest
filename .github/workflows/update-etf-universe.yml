name: Update Taiwan ETF universe

on:
  schedule:
    # UTC 週日至週四 23:00 = 台北週一至週五 07:00。
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-taiwan-etf-universe
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build official Taiwan ETF universe
        run: python scripts/update_etf_universe.py

      - name: Commit changed ETF universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-universe.json
          git diff --cached --quiet || git commit -m "Update Taiwan ETF universe"
          git pull --rebase origin main
          git push origin main
