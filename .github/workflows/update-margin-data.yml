name: Update margin risk data

on:
  schedule:
    # UTC 10:00 / 11:00 = 台北時間平日 18:00 / 19:00。
    - cron: "0 10 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-margin-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch structured after-hours margin data
        run: python scripts/update_margin_data.py
      - name: Commit margin cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- margin-data.json margin-cost-state.json
          git diff --cached --quiet || git commit -m "Update margin risk data"
          git push
