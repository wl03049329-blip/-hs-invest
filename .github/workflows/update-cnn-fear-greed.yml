name: Update CNN Fear and Greed

on:
  schedule:
    # 台北週一至週五 07:00（UTC 前一日 23:00）
    - cron: "0 23 * * 0-4"
    # 台北週一至週五 22:30（UTC 當日 14:30）
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate CNN Fear and Greed
        run: python -u scripts/update_cnn_fear_greed.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnn-fear-greed.json
          git diff --cached --quiet || git commit -m "Update CNN Fear & Greed data"
          git push
