name: HS Stable App Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update delayed market quotes
      - Finalize official EOD Core Score history
      - Publish Railway live artifacts
      - Update CNN Fear and Greed
      - Update delayed commodity quotes
      - Update Taiwan ETF universe
      - Update ETF valuation
      - Update futures positioning
      - Update margin risk data
      - Update official margin balance
      - Update official home TAIEX close
      - Update official home TMF snapshot
      - Update market events
      - Update Trump market watch
    types: [completed]
permissions:
  contents: read
concurrency:
  group: hs-stable-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  observation-00631l:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/00631l-crash-radar-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test locked observation, historical archive and mobile layout
        run: |
          node tests/test_00631l_observation.js
          python3 -B -m unittest discover -s tests -p test_00631l_observation_openapi.py
          node tests/test_00631l_openapi_close.cjs
          node tests/test_c4_openapi_close_candidate.cjs
          node tests/test_lradar_v1.js
          node tests/test_radar_daily_workflow.js
          npm install --prefix "$RUNNER_TEMP/hs-browser" playwright-core@1.62.1
          "$RUNNER_TEMP/hs-browser/node_modules/.bin/playwright-core" install --with-deps chrome webkit
          NODE_PATH="$RUNNER_TEMP/hs-browser/node_modules" node tests/00631l_observation_browser.cjs
  radar-mobile-v4:
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/radar-mobile-v4' || github.head_ref == 'fix/radar-v4-sticky-toolbar' || github.head_ref == 'fix/radar-mobile-chart-selection')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate radar UI and frozen FINAL interfaces
        run: |
          node tests/test_etf_radar_v2_phase1.js
          node tests/test_etf_radar_detail_phase85.js
          node tests/test_radar_detail_flow.js
          node tests/test_finalized_core_score_history.js
          node tests/test_radar_daily_refresh.js
      - name: Browser chart, mobile and PWA regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/hs-browser" playwright-core@1.62.1
          "$RUNNER_TEMP/hs-browser/node_modules/.bin/playwright-core" install --with-deps chrome webkit
          export NODE_PATH="$RUNNER_TEMP/hs-browser/node_modules"
          node tests/radar_mobile_v4_browser.cjs
          if [ "$GITHUB_HEAD_REF" != "fix/radar-v4-sticky-toolbar" ]; then
            node tests/c4_chart_points_browser.cjs
            HS_APP_TEST_OUT="$RUNNER_TEMP/hs-radar-pwa" node tests/stable_app_update_browser.cjs
          fi
  portfolio-verified-display:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/portfolio-verified-display'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify portfolio and frozen data contracts
        run: |
          node tests/test_portfolio_price_independence.js
          node tests/test_portfolio_experience360.js
          node tests/test_asset_summary353.js
      - name: Compare mobile baseline and run portfolio and PWA regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/hs-browser" playwright-core@1.62.1
          "$RUNNER_TEMP/hs-browser/node_modules/.bin/playwright-core" install --with-deps chrome webkit
          export NODE_PATH="$RUNNER_TEMP/hs-browser/node_modules"
          git worktree add --detach "$RUNNER_TEMP/hs-baseline" ce946dd28de9b1a49bb7a5f09098157afe46bf1b
          HS_BASELINE_ROOT="$RUNNER_TEMP/hs-baseline" node tests/portfolio_verified_display_browser.cjs
          node tests/c4_chart_points_browser.cjs
          HS_APP_TEST_OUT="$RUNNER_TEMP/hs-portfolio-pwa" node tests/stable_app_update_browser.cjs
  c4-chart-mobile:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/c4-chart-direct-points'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify direct chart touch and original PWA in Chrome and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/hs-browser" playwright-core@1.62.1
          "$RUNNER_TEMP/hs-browser/node_modules/.bin/playwright-core" install --with-deps chrome webkit
          export NODE_PATH="$RUNNER_TEMP/hs-browser/node_modules"
          node tests/c4_chart_points_browser.cjs
          HS_APP_TEST_OUT="$RUNNER_TEMP/hs-chart-pwa" node tests/stable_app_update_browser.cjs
  final-resumption-acceptance:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 60 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reproduce 11/17 FINAL in a private temporary file
        env:
          TZ: UTC
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/final-proof"
          python3 -B -m scripts.update_radar_daily --as-of 2026-11-17 --evidence-dir "$RUNNER_TEMP/final-proof" --eod-split-proof "$RUNNER_TEMP/final-proof/proof.json"
          python3 -B scripts/fetch_official_eod_market.py --expected-date 2026-11-17 --output "$RUNNER_TEMP/final-proof/eod.json"
          cp finalized-core-score-snapshots-v1.json "$RUNNER_TEMP/final-proof/final.json"
          node scripts/finalize_core_score_history.js --eod "$RUNNER_TEMP/final-proof/eod.json" --expected-date 2026-11-17 --split-proof "$RUNNER_TEMP/final-proof/proof.json" --output "$RUNNER_TEMP/final-proof/final.json"
          node -e 'const a=require(process.argv[1]).snapshots.at(-1); if(a?.date!=="2026-11-17"||a.snapshot_type!=="FINALIZED_CLOSE"||!a.finalized||a.rows.filter(r=>Number.isFinite(r.final_core_score)).length!==5)throw Error("REAL_FINAL_NOT_VERIFIED"); console.log(a.date,a.rows.map(r=>[r.symbol,r.final_core_score]));' "$RUNNER_TEMP/final-proof/final.json"
  final-resumption-browser:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 60
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run existing Chrome and WebKit PWA contract
        run: |
          npm install --prefix "$RUNNER_TEMP/hs-browser" playwright-core@1.62.1
          "$RUNNER_TEMP/hs-browser/node_modules/.bin/playwright-core" install --with-deps chrome webkit
          NODE_PATH="$RUNNER_TEMP/hs-browser/node_modules" HS_APP_TEST_OUT="$RUNNER_TEMP/hs-final-browser" node tests/stable_app_update_browser.cjs
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify C4 split recovery without publishing
        if: github.event_name == 'pull_request'
        run: |
          python3 -B tests/test_official_eod_market.py
          python3 -B -m unittest discover -s tests -p 'test_radar_daily_split_resume.py'
      - name: Validate stable update and data contracts
        run: |
          node tests/test_stable_app_updates.js
          node tests/test_stable_app_update_lifecycle.js
          node tests/test_stable_app_install_diagnostics.js
          node tests/test_portfolio_custom_positions.js
          node tests/test_portfolio_custom_positions_storage.js
          node tests/test_portfolio_group_strategy.js
          node tests/test_portfolio_group_strategy_plan.js
          node tests/test_portfolio_group_strategy_storage.js
          node tests/test_personal_v2_namespace.js
          node tests/test_portfolio_display_ui.js
          node tests/test_official_margin_balance.js
          node --test tests/test_home_taiex.js
          node --test tests/test_home_tmf.js
          node tests/test_c4_close_observations.js
          node tests/test_radar_history_lifecycle.js
          node tests/test_lradar_v1.js
          node tests/test_lc4_research_integration.js
          node tests/test_lc4_radar_v2.js
      - name: Build exact-commit static release
        run: node scripts/build_stable_app.cjs "$RUNNER_TEMP/hs-site"
      - name: Check deployment scope
        id: scope
        env:
          HS_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/stable_pages_push_scope.cjs >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # official v3
        if: steps.scope.outputs.deploy == 'true'
        with:
          path: ${{ runner.temp }}/hs-site
  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Withhold superseded artifact
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$head" = "$GITHUB_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; else echo 'deploy=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # official v5
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy verified artifact
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # official v4
