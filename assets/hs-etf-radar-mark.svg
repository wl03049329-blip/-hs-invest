<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HS ETF雷達</title>
  <desc id="desc">HS 字標結合雷達掃描線與市場K線節點</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141b"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#35d6ff"/>
      <stop offset=".55" stop-color="#6f7cff"/>
      <stop offset="1" stop-color="#b468ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#242936" stroke-width="4"/>
  <path d="M104 304a152 152 0 0 1 304 0" fill="none" stroke="#252b38" stroke-width="18" stroke-linecap="round"/>
  <path d="M146 304a110 110 0 0 1 220 0" fill="none" stroke="#303746" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 304 388 184" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="304" r="20" fill="#090b10" stroke="#35d6ff" stroke-width="10"/>
  <path d="M116 352h280" stroke="#363e4f" stroke-width="6" stroke-linecap="round"/>
  <path d="M158 337v-48m0 12v22m66 16v-78m0 17v43m66 18v-104m0 20v55m66 29v-68m0 14v34" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
  <text x="256" y="434" text-anchor="middle" fill="#f6f8ff" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="900" letter-spacing="8">HS</text>
</svg>
