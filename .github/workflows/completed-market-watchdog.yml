name: Completed market publication watchdog
on:
  schedule:
    # Independent off-peak recovery: Taipei18:47 /20:47 /22:47 /next08:47.
    # The existing repair path revalidates FINAL as well as quotes/daily bars.
    - cron: "47 0,10,12,14 * * 1-5"
  workflow_dispatch:
    inputs:
      producer_result:
        description: 'Daily producer completion result; forces immediate public attestation, never grants health'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/completed-market-watchdog.yml'
      - 'scripts/check_completed_market.py'
      - 'tests/test_completed_market.py'
      - 'tests/test_completed_market_workflow.js'
  workflow_run:
    # Audit actual publication, not merely producer success. Repairs use the
    # existing serialized collector; a healthy publication never dispatches it.
    workflows: [HS Stable App Pages]
    types: [completed]
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: hs-completed-market-watchdog-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          python -B -m unittest discover -s tests -p 'test_completed_market.py'
          node tests/test_completed_market_workflow.js
  audit:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public source dates and request bounded existing recovery
        id: audit
        continue-on-error: true
        env:
          HS_COMPLETED_AUDIT_TRIGGER: ${{ github.event_name }}
          HS_COMPLETED_PRODUCER_RESULT: ${{ inputs.producer_result }}
        run: python -m scripts.check_completed_market --repair --report "$RUNNER_TEMP/completed-market.json"
      - name: Report incomplete publication (not a trading signal)
        id: incident
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), marker='<!-- hs-completed-market-v1 -->';
            let report;
            try { report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/completed-market.json','utf8')); }
            catch { report={healthy:false,reasons:['AUDIT_OR_CALENDAR_UNAVAILABLE']}; }
            if (!report || !Array.isArray(report.reasons) ||
                (report.deferred !== true && typeof report.healthy !== 'boolean'))
              report={healthy:false,reasons:['AUDIT_OR_CALENDAR_UNAVAILABLE']};
            if (report.deferred === true) {
              // Mid-session or bounded daily publication handoff is not healthy.
              // Do not close prior alerts while awaiting public verification.
              core.notice(report.waiting || report.reasons.join(', '), {title:'Completed market publication: waiting'});
              await core.summary.addCodeBlock(JSON.stringify(report,null,2),'json').write();
              return;
            }
            const issues=await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open',per_page:100});
            const prior=issues.find(i=>!i.pull_request&&i.user?.login==='github-actions[bot]'&&i.body?.startsWith(marker+'\n'));
            // Dates, run IDs and repair attempts are diagnostic context, not
            // new incidents. Keep the failing market, bar status and root cause.
            const incidentKey = r => JSON.stringify([
              [...new Set(r.reasons)].sort(),
              Object.entries(r.daily_unverified || {}).sort(([a],[b])=>a.localeCompare(b)).map(([symbol,row])=>
                [symbol,row.status??null,(row.reason||'').replace(/\b20\d\d-\d\d-\d\d\b/g,'<date>')])
            ]);
            if (!report.healthy) {
              let previous;
              if(prior) {
                try { previous=JSON.parse(prior.body.slice(prior.body.indexOf('\n\n{')+2,prior.body.lastIndexOf('\nRun: '))); }
                catch { /* An unrecognized prior report cannot suppress an alert. */ }
              }
              if(previous?.healthy===false&&Array.isArray(previous.reasons)&&incidentKey(previous)===incidentKey(report)) {
                core.notice('Known incomplete publication; existing issue unchanged.',{title:'Completed market publication: repeat'});
                core.setOutput('disposition','duplicate');
              } else {
                const body=marker+'\n公開行情尚未驗證完成；已保留最後有效資料。補救請求不代表完成。\n\n'+JSON.stringify(report,null,2)+'\nRun: '+context.runId;
                if(prior) await github.rest.issues.update({...context.repo,issue_number:prior.number,body});
                else await github.rest.issues.create({...context.repo,title:'Completed market publication requires attention',body});
              }
            } else if(prior) await github.rest.issues.update({...context.repo,issue_number:prior.number,state:'closed'});
            await core.summary.addCodeBlock(JSON.stringify(report,null,2),'json').write();
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-market-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/completed-market.json
          retention-days: 30
      - name: Fail on a new or changed incident
        if: steps.audit.outcome != 'success' && steps.incident.outputs.disposition != 'duplicate'
        run: exit 1
