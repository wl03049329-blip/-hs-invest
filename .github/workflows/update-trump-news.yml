name: Update Trump market watch

on:
  schedule:
    - cron: "20 22 * * 0-5" # 台北時間每天 06:20（週一至週六）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Trump news JSON
        run: python scripts/update_trump_news.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trump-news.json
          git diff --cached --quiet || git commit -m "Update Trump market watch"
          git push
