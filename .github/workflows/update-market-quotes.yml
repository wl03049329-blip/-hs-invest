name: Update delayed market quotes

on:
  schedule:
    # UTC 週一至週五 01:00～06:55 = 台北週一至週五 09:00～14:55（現貨，每 5 分鐘）。
    - cron: "*/5 1-6 * * 1-5"
    # UTC 週一至週五 07:00～15:59 = 台北週一至週五 15:00～23:59（期貨夜盤，每 10 分鐘）。
    - cron: "*/10 7-15 * * 1-5"
    # 補跑台北 23:55（UTC 15:55），涵蓋指定夜盤尾端時間。
    - cron: "55 15 * * 1-5"
    # UTC 週一至週五 16:00～20:59 = 台北週二至週六 00:00～04:59。
    # UTC 星期五會在台北星期六凌晨繼續執行，涵蓋週五夜盤跨日。
    - cron: "*/10 16-20 * * 1-5"
    # UTC 週一至週五 21:00 = 台北週二至週六 05:00 夜盤收尾。
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-delayed-market-quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch structured Taiwan market caches
        run: python scripts/update_market_quotes.py
      - name: Commit changed quote cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-quotes.json market-quotes-meta.json market-overview.json
          git diff --cached --quiet || git commit -m "Update delayed Taiwan market quotes"
          git push
