name: Update delayed commodity quotes

on:
  schedule:
    # 商品期貨交易日每 10 分鐘檢查一次；來源時間戳未變時不產生新 commit。
    - cron: "*/10 * * * 1-5"
    - cron: "*/10 22-23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-delayed-commodity-quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch structured delayed commodity quotes
        run: python scripts/update_commodity_quotes.py
      - name: Commit changed commodity cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commodity-quotes.json
          git diff --cached --quiet || git commit -m "Update delayed commodity quotes"
          git push
