name: Audit TWSE daily close capture (no publication)
on:
  workflow_dispatch:
    inputs:
      candidate_probe:
        description: 'Run a read-only latest completed session probe on the candidate branch'
        type: boolean
        default: false
      archive_00631l:
        description: 'Run only the independent 00631L archive (read-only on candidate branches)'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/audit-twse-close-capture.yml'
      - 'scripts/*twse*close*.cjs'
      - 'scripts/c4_openapi_close_candidate.cjs'
      - 'tests/test_*close*.cjs'
  schedule:
    - cron: '20 10 * * 1-5' # 18:20 Asia/Taipei
      timezone: 'Etc/UTC'
    - cron: '20 12 * * 1-5' # 20:20 Asia/Taipei
      timezone: 'Etc/UTC'
    - cron: '53 13 * * 1-5' # independent 21:53 catch-missed-runs check
      timezone: 'Etc/UTC'
    - cron: '17 0 * * 2-6' # 08:17 Taipei: retry the previous completed session
      timezone: 'Etc/UTC'
permissions:
  contents: read
  actions: read
concurrency:
  group: twse-close-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          node --test tests/test_c4_openapi_close_candidate.cjs tests/test_audit_twse_close_capture.cjs tests/test_stable_pages_push_scope.cjs
          node tests/test_c4_close_observations.js
          node tests/test_stable_app_update_lifecycle.js
  probe:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.candidate_probe && github.ref == 'refs/heads/feat/twse-close-capture')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probe two current snapshots without retaining quotes
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const {capture}=require('./scripts/audit_twse_close_capture.cjs');
          const {sessions}=require('./scripts/audit_twse_close_watchdog.cjs');
          (async()=>{
            const now=new Date(Date.now()+8*3600000).toISOString().slice(0,10);
            const r=await fetch('https://openapi.twse.com.tw/v1/exchangeReport/FMTQIK',{redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!r.ok) throw Error('MARKET_SESSION_HTTP_'+r.status);
            const day=sessions(await r.json(),now.slice(0,7)+'-01',now).at(-1);
            if(!day) throw Error('LATEST_COMPLETED_SESSION_UNKNOWN');
            const first=await capture(day,null);
            await new Promise(resolve=>setTimeout(resolve,2000));
            const second=await capture(day,first);
            console.log(JSON.stringify({type:'LATEST_COMPLETED_SESSION_PROBE',day,first,second}));
            fs.writeFileSync('candidate-probe.json',JSON.stringify({day,first,second},null,2)+'\n',{flag:'wx'});
            if(Object.values(second.symbols).some(row=>row.status!=='CANDIDATE_OHLCV'||row.revised))
              throw Error('LIVE_PROBE_SYMBOL_UNAVAILABLE_OR_REVISED');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - if: always() && hashFiles('candidate-probe.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: twse-candidate-probe
          path: candidate-probe.json
          retention-days: 30
          overwrite: false
  browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hs-browser" playwright-core@1.62.1
          "$RUNNER_TEMP/hs-browser/node_modules/.bin/playwright-core" install --with-deps chrome webkit
      - name: Verify Chrome and WebKit PWA lifecycle
        env:
          NODE_PATH: ${{ runner.temp }}/hs-browser/node_modules
          HS_APP_TEST_OUT: ${{ runner.temp }}/hs-twse-browser-evidence
        run: node tests/stable_app_update_browser.cjs
  capture:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.archive_00631l && github.event.schedule != '53 13 * * 1-5' && github.event.schedule != '17 0 * * 2-6' && vars.HS_TWSE_CLOSE_CAPTURE_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test tests/test_c4_openapi_close_candidate.cjs tests/test_audit_twse_close_capture.cjs
      - name: Locate original same-session audit receipt
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event.schedule }}" in
            '20 10 * * 1-5') slot=18:20 ;;
            '20 12 * * 1-5') slot=20:20 ;;
            '') slot=manual ;;
            *) exit 1 ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "slot_id=${slot/:/-}" >> "$GITHUB_OUTPUT"
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          test -n "$created"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          node scripts/audit_twse_close_watchdog.cjs --context "$slot" "$created" > timing.json
          day=$(node -p 'JSON.parse(require("fs").readFileSync("timing.json")).targetDate')
          echo "day=$day" >> "$GITHUB_OUTPUT"
          prior=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=twse-close-${GITHUB_REF_NAME//\//-}-$day&per_page=100" | jq -s -r '[.[].artifacts[] | select(.expired == false)] | sort_by(.created_at, .id) | .[0].workflow_run.id // empty')
          artifact="twse-close-${GITHUB_REF_NAME//\//-}-$day"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          if [[ -n "$prior" ]]; then
            gh run download "$prior" --name "$artifact" --dir prior
            test -f prior/receipt.json
          fi
      - name: Verify current Taipei session and detect revisions
        id: audit
        continue-on-error: true
        env:
          HS_CAPTURE_SLOT: ${{ steps.prior.outputs.slot }}
          HS_RUN_CREATED_AT: ${{ steps.prior.outputs.created }}
          HS_SESSION_DATE: ${{ steps.prior.outputs.day }}
          HS_AUDIT_REPORT: capture-report.json
        run: node scripts/audit_twse_close_capture.cjs receipt.json prior/receipt.json "$HS_SESSION_DATE"
      - name: Store immutable per-run receipt (no raw quotes)
        if: always() && hashFiles('receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prior.outputs.artifact }}
          path: receipt.json
          retention-days: 30
          overwrite: false
      - name: Mark clean receipt for watchdog
        id: clean
        if: steps.audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prior.outputs.artifact }}-ok-${{ steps.prior.outputs.slot_id }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Preserve attempt diagnostics (not a clean receipt)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: twse-close-attempt-${{ github.run_id }}
          path: |
            timing.json
            capture-report.json
          retention-days: 30
          overwrite: false
      - name: Reconcile persistent capture incident
        id: incident
        if: always()
        uses: actions/github-script@v7
        env:
          HS_TARGET_DATE: ${{ steps.prior.outputs.day }}
          HS_CLEAN_MARKER_OUTCOME: ${{ steps.clean.outcome }}
        with:
          script: |
            const fs=require('fs'), {notify,publicationReport}=require('./scripts/audit_twse_close_watchdog.cjs');
            let report;
            try { report=JSON.parse(fs.readFileSync('capture-report.json','utf8')); }
            catch { const date=process.env.HS_TARGET_DATE||new Date(Date.now()+8*3600000).toISOString().slice(0,10);
              report={scope:'capture:'+date,healthy:false,incidents:[{date,code:'CAPTURE_DIAGNOSTIC_UNAVAILABLE'}]}; }
            report=publicationReport(report,process.env.HS_CLEAN_MARKER_OUTCOME);
            core.setOutput('disposition',await notify({github,context,core,report}));
      - name: Fail once on a new or changed capture incident
        if: steps.audit.outcome == 'failure' && steps.incident.outputs.disposition != 'duplicate' && steps.incident.outputs.disposition != 'changed'
        run: exit 1
  watchdog:
    if: github.ref == 'refs/heads/main' && github.event.schedule == '53 13 * * 1-5' && vars.HS_TWSE_CLOSE_CAPTURE_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check observed market sessions since enablement
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HS_CAPTURE_START: ${{ vars.HS_TWSE_CLOSE_CAPTURE_START }}
          HS_CAPTURE_SLOT: ${{ github.event.schedule }}
          HS_AUDIT_REPORT: watchdog-report.json
        run: |
          export HS_RUN_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          node scripts/audit_twse_close_watchdog.cjs
      - name: Reconcile persistent missing-receipt incident
        id: incident
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), {notify}=require('./scripts/audit_twse_close_watchdog.cjs');
            let report;
            try { report=JSON.parse(fs.readFileSync('watchdog-report.json','utf8')); }
            catch { const date=new Date(Date.now()+8*3600000).toISOString().slice(0,10);
              report={scope:'watchdog',healthy:false,incidents:[{date,code:'WATCHDOG_DIAGNOSTIC_UNAVAILABLE'}]}; }
            core.setOutput('disposition',await notify({github,context,core,report}));
      - if: always() && hashFiles('watchdog-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: twse-close-watchdog-${{ github.run_id }}
          path: watchdog-report.json
          retention-days: 30
          overwrite: false
      - name: Fail once on a new missing-receipt incident
        if: steps.audit.outcome == 'failure' && steps.incident.outputs.disposition != 'duplicate' && steps.incident.outputs.disposition != 'changed'
        run: exit 1
  archive-00631l-verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.archive_00631l && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test tests/test_audit_twse_close_capture.cjs
      - name: Probe dated TWSE source without publishing or backfilling
        run: |
          mkdir "$RUNNER_TEMP/archive-00631l"
          mode=evening
          if [[ "$(TZ=Asia/Taipei date +%H)" < 12 ]]; then mode=morning; fi
          node scripts/audit_twse_close_capture.cjs --00631l-archive "$RUNNER_TEMP/archive-00631l" "$mode"
          mkdir "$RUNNER_TEMP/archive-00631l-probe"
          node scripts/audit_twse_close_capture.cjs --00631l-archive "$RUNNER_TEMP/archive-00631l-probe" probe
          node scripts/audit_twse_close_capture.cjs --00631l-archive "$RUNNER_TEMP/archive-00631l-probe" probe
  archive-00631l:
    if: github.ref == 'refs/heads/main' && vars.HS_00631L_OPEN_CLOSE_ARCHIVE_ENABLED == '1' && (github.event_name == 'schedule' || inputs.archive_00631l)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Append exactly one validated close to the data-only branch
        env:
          HS_SLOT: ${{ github.event.schedule }}
          HS_00631L_CROSS_MONTH_CALENDAR: '1'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/archive-00631l"
          mkdir "$dir"
          branch=refs/heads/data/00631l-open-close
          parent=""
          if git ls-remote --exit-code origin "$branch"; then
            git fetch --no-tags origin "$branch"
            parent=$(git rev-parse FETCH_HEAD)
            git archive "$parent" | tar -x -C "$dir"
          else
            [[ "$?" == 2 ]]
          fi
          mode=evening
          if [[ "$HS_SLOT" == '17 0 * * 2-6' ]]; then mode=morning
          elif [[ -z "$HS_SLOT" && "$(TZ=Asia/Taipei date +%H)" < 12 ]]; then mode=manual-morning; fi
          export HS_00631L_FILE_LIST="$RUNNER_TEMP/00631l-file-list"
          node scripts/audit_twse_close_capture.cjs --00631l-archive "$dir" "$mode" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ -s "$HS_00631L_FILE_LIST" ]] || exit 0
          mapfile -t files < "$HS_00631L_FILE_LIST"
          [[ "${#files[@]}" -ge 1 && "${#files[@]}" -le 2 ]]
          for file in "${files[@]}"; do [[ "$file" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}\.json$ ]]; done
          export GIT_INDEX_FILE="$RUNNER_TEMP/00631l-index"
          parents=()
          if [[ -n "$parent" ]]; then
            git read-tree "$parent"
            parents=(-p "$parent")
          else
            git read-tree --empty
          fi
          for file in "${files[@]}"; do
            if [[ -n "$parent" ]] && git cat-file -e "$parent:$file" 2>/dev/null; then exit 1; fi
            blob=$(git hash-object -w "$dir/$file")
            git update-index --add --cacheinfo "100644,$blob,$file"
          done
          # The date files remain immutable; this is a derived, replaceable read index.
          node -e 'const fs=require("node:fs"),p=process.argv[1];const records=fs.readdirSync(p).filter(n=>/^20[0-9]{2}-[0-9]{2}-[0-9]{2}\.json$/.test(n)).sort().map(n=>JSON.parse(fs.readFileSync(p+"/"+n,"utf8")));process.stdout.write(JSON.stringify({schema:"HS_00631L_OPEN_INDEX_V1",records})+"\n")' "$dir" > "$RUNNER_TEMP/00631l-public-index.json"
          indexblob=$(git hash-object -w "$RUNNER_TEMP/00631l-public-index.json")
          git update-index --add --cacheinfo "100644,$indexblob,index.json"
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(git commit-tree "$(git write-tree)" "${parents[@]}" -m "Archive verified 00631L close ${file%.json}")
          git push origin "$commit:$branch"
