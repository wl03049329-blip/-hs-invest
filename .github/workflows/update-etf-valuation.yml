name: Update ETF valuation

on:
  schedule:
    # UTC 23:10 = 台北時間 07:10；週日至週四 UTC 對應台北週一至週五。
    - cron: "10 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-etf-valuation
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch issuer valuation JSON
        run: python scripts/update_etf_valuation.py
      - name: Commit valuation cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-valuation.json valuation-history.json
          git diff --cached --quiet || git commit -m "Update ETF valuation data"
          git push
