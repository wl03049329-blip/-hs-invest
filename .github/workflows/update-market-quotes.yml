name: Update delayed market quotes

on:
  schedule:
    # 台北週一至週五 08:25 啟動單一 session；job 內依序執行五個正式 slot。
    - cron: "25 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-delayed-market-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure intraday session committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run validated 09:30–13:30 radar session
        run: python scripts/run_intraday_radar_session.py
