name: Update delayed market quotes

on:
  schedule:
    # 台北週一至週五每個 slot 的預喚醒、正點與合法重試窗口。
    # 最後一次為 slot +15 分鐘；不可在窗口外回填未來行情。
    - cron: "27,30,35,40,45 1,2,3,4,5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-delayed-market-quotes
  cancel-in-progress: false
  # Preserve the short retry ticks.  The default single pending run can replace
  # an earlier tick before it reaches its legal as-of window.
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure intraday session committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run one idempotent intraday radar scheduler tick
        run: python scripts/run_intraday_radar_session.py --scheduled-once
