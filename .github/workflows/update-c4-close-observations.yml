name: Update independent C4 close observations
on:
  schedule:
    - cron: '20 10,12 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c4-close-observations
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Validate observation publisher
        run: node --test tests/test_c4_close_observation_publisher.cjs
      - name: Stage independent observations
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          node scripts/update_c4_close_observations.cjs --write
          node tests/test_c4_close_observations.js
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "data/c4-close-observations-v1.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/c4-close-observations-v1.json
          git commit -m 'Publish independently verified C4 close observations'
          git push origin HEAD:main
      - name: Flag failed observation publication
        if: failure()
        run: echo "::error::Independent C4 close observation job failed. Inspect source/date checks; no FINAL fallback is allowed."
