name: Update delayed market quotes

on:
  schedule:
    # Fallback/audit cadence. Railway is the primary live producer; this
    # schedule remains an independent best-effort recovery path.
    # Each delayed run classifies itself from the actual Taipei runtime; cron
    # is only a retry cadence and never assigns or backfills a historical slot.
    - cron: "*/5 1 * * 1-5"
    - cron: "*/5 2,3,4,5 * * 1-5"
    # 14:30 is an audit-only boundary tick: it may mark 13:30 MISSED but can
    # never fetch or backfill that now-closed slot.
    - cron: "0,5,10,15,20,30 6 * * 1-5"
    # Independent official-close cache checks: before open and after the
    # exchanges have had time to publish their closing bulk files.
    - cron: "30 0 * * 1-5"
    - cron: "30 8,10 * * 1-5"
    # Source-ready FINAL / official-close retries after13:30. These are only
    # opportunities to validate; a clock tick never promotes missing data.
    - cron: "45 5,6 * * 1-5"
    - cron: "0,15,30,45 7 * * 1-5"
    - cron: "0 8,9,10 * * 1-5"
    - cron: "37 12,14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: hs-live-intraday-slot-v4
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure intraday session committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run one idempotent intraday radar scheduler tick
        env:
          HS_INTRADAY_TRIGGER: ${{ github.event_name }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python scripts/run_intraday_radar_session.py --scheduled-once

  eod:
    name: Finalize official EOD independently
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      group: hs-eod-core-history
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure EOD history committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: Finalize official EOD Core Score history
        run: |
          # Candidate from the official calendar, after13:30 (not18:00 raw K).
          # Only complete official OHLC + matching adjusted history can finalize.
          # Midnight/pre-open still request the previous completed session.
          expected_date="$(python -m scripts.check_completed_market --final-expected-only)"
          python scripts/fetch_official_eod_market.py \
            --expected-date "$expected_date" \
            --output "${RUNNER_TEMP}/official-eod-market.json"
          # Bound the whole response/body lifetime, not just connection setup.
          # An unavailable optional history source cannot indefinitely hold EOD.
          set -o pipefail
          timeout --signal=TERM 120s node scripts/finalize_core_score_history.js \
            --eod "${RUNNER_TEMP}/official-eod-market.json" \
            --expected-date "$expected_date" | tee "${RUNNER_TEMP}/finalized-core-result.log"
          if grep -q 'FINALIZED_CORE_HISTORY_SOURCE_NOT_READY' "${RUNNER_TEMP}/finalized-core-result.log"; then
            echo "::error::Official Core history unavailable; old finalized data retained."
            exit 1
          fi
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("finalized-core-score-snapshots-v1.json")),d=process.argv[1];if(!p.snapshots.some(s=>s.date===d&&s.finalized===true&&s.snapshot_type==="FINALIZED_CLOSE"))throw Error("FINAL_DATE_NOT_PUBLISHED:"+d)' "$expected_date"
      - name: Commit finalized EOD Core Score history
        id: publish
        run: |
          git add finalized-core-score-snapshots-v1.json
          if git diff --cached --quiet; then
            echo "FINAL_ALREADY_VERIFIED_NO_HISTORY_OVERWRITE"
            exit 0
          fi
          git commit -m "Update official ETF radar score history"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish verified FINAL even if the unrelated LIVE job fails
        env:
          FINAL_CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          # A no-op Git commit is not proof that the prior deployment succeeded.
          # Reuse a verified public FINAL, otherwise repair the site publication.
          if [ "$FINAL_CHANGED" != true ] && python -m scripts.verify_stable_pages --base-url "https://wl03049329-blip.github.io/-hs-invest/" --verify-final --attempts 1; then
            exit 0
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hs-stable-pages.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')
          gh workflow run hs-stable-pages.yml --ref main
          found=''
          for attempt in $(seq 1 12); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hs-stable-pages.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')
            if [ "$id" -gt "$previous" ]; then found="$id"; break; fi
            sleep 5
          done
          test -n "$found" || { echo '::error::PAGES_RUN_NOT_CREATED'; exit 1; }
          gh run watch "$found" --interval 5 --exit-status
          python -m scripts.verify_stable_pages --base-url "https://wl03049329-blip.github.io/-hs-invest/" --verify-final

  official_quote_cache:
    name: Refresh official Portfolio quote cache independently
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    concurrency:
      # Same files as Railway / intraday publication: one writer at a time.
      group: hs-live-intraday-slot-v4
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify actual Taipei runtime (never the delayed cron label)
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Taipei"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("allowed=" + str(now.hour < 9 or (now.hour, now.minute) >= (13, 30)).lower() + "\n")
          PY
      - name: Refresh official TWSE and TPEx closing quotes
        id: quotes
        if: steps.window.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python scripts/update_market_quotes.py --official-close-only
          git add -- market-quotes.json market-quotes-meta.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official Portfolio quote cache"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Independently publish and verify the official quote commit
        if: steps.quotes.outputs.changed == 'true'
        # GITHUB_TOKEN pushes do not trigger push workflows. Do not wait for
        # unrelated Core history success to publish verified official prices.
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hs-stable-pages.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')
          gh workflow run hs-stable-pages.yml --ref main
          found=''
          for attempt in $(seq 1 12); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hs-stable-pages.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')
            if [ "$id" -gt "$previous" ]; then found="$id"; break; fi
            sleep 5
          done
          test -n "$found" || { echo '::error::PAGES_RUN_NOT_CREATED'; exit 1; }
          gh run watch "$found" --interval 5 --exit-status
          python -m scripts.verify_stable_pages --base-url "https://wl03049329-blip.github.io/-hs-invest/"
