name: Update futures positioning

on:
  schedule:
    # 台北平日 15:30、16:30、18:00、20:00；加上台北平日 07:00
    # 的低成本補抓。每次為獨立 tick，絕不在 runner 內長時間等待。
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-futures-position
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate official TAIFEX positioning
        run: python scripts/update_futures_position.py
      - name: Commit changed futures cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add futures-position.json
          git diff --cached --quiet || git commit -m "Update futures positioning"
          git push
