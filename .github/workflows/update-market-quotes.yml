name: Update delayed market quotes

on:
  schedule:
    # 台北週一至週五 09:30、10:30、11:30、12:30、13:30，更新 ETF 盤中試算排名。
   on:
  schedule:
    # 台北週一至週五 09:30、10:30、11:30、12:30、13:30，更新 ETF 盤中試算排名。
    - cron: "32 1,2,3,4,5 * * 1-5"
    - cron: "42 1,2,3,4,5 * * 1-5"
  workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-delayed-market-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch structured Taiwan market caches
        run: python scripts/update_market_quotes.py
      - name: Commit changed quote cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-quotes.json market-quotes-meta.json market-overview.json tx-futures-quote.json
          git diff --cached --quiet || git commit -m "Update delayed Taiwan market quotes"
          git push
