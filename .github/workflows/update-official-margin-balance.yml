name: Update official margin balance
on:
  schedule:
    - cron: "0 10,13 * * 1-5"
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-official-margin-balance-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate and collect official market balances
        run: |
          python3 -m unittest discover -s tests -p 'test_official_margin_balance.py'
          python3 scripts/update_official_margin_balance.py
          node tests/test_official_margin_balance.js
      - name: Publish only official display cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- official-margin-balance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update official margin balance"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
